# 桌面发行同步：将已公开的稳定版 Release 资产同步到腾讯云 COS，并清理所选平台的旧版本。
#
# 使用方法：
#   1. 发布正式版 Release 会自动触发；GITHUB_TOKEN 创建的 Release 需在 Actions 中手动运行本工作流。
#   2. 手动运行时填写 vX.Y.Z 标签并选择平台；首次保持 dry_run=true 检查上传和清理计划，再关闭后正式同步。
#   3. 选择 all 会依次同步 Windows 与 macOS；失败后也可选择单个平台重新运行。
#
# 配置与权限：
#   - Secrets：S3_ACCESS_KEY_ID、S3_SECRET_ACCESS_KEY；Variables：S3_BUCKET、S3_ENDPOINT、S3_REGION、PURECHAT_DESKTOP_UPDATE_URL。
#   - 可选 Variable：S3_PUBLIC_DOMAIN；S3_ENABLE_PATH_STYLE 与 S3_SET_ACL 固定为 0。
#   - 仅需 contents: read；工作流从默认分支检出发布脚本，并禁用依赖 lifecycle scripts。
#   - 安装包、更新清单校验及 COS 发布锁由 desktop:upload 执行；COS 同步不构建安装包。
# 详细配置与故障排查见 docs/self-hosting/platform/desktop-cos-sync.md。
name: Sync desktop release to COS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已公开的稳定版本，例如 v0.3.0
        required: true
        type: string
      platform:
        description: 同步平台
        type: choice
        default: all
        options: [all, windows, mac]
      dry_run:
        description: 只校验和预览，不上传或删除
        type: boolean
        default: true

permissions:
  # 只读取 Release 资产；发布目标是 COS，不需要写 GitHub Release。
  contents: read

concurrency:
  group: desktop-cos-sync
  # 已开始的 COS 发布不能被后续运行打断；queue: max 允许最多 100 个运行等待，不替换旧的排队运行。
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    # 没有配置 COS 更新地址时，原 GitHub 发行流程继续工作。
    if: github.event_name == 'workflow_dispatch' || (vars.PURECHAT_DESKTOP_UPDATE_URL != '' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    # all 会串行上传两个平台并校验公共下载地址，预留较长时间完成 COS 同步。
    timeout-minutes: 120
    env:
      # 下载 GitHub Release 资产；该令牌只需 contents: read。
      GH_TOKEN: ${{ github.token }}
      # Release 事件使用触发版本；手动运行时使用输入的标签和平台。
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      TARGET_PLATFORM: ${{ inputs.platform || 'all' }}
      # 手动运行默认为 dry run；正式 Release 事件会执行实际同步。
      DRY_RUN: ${{ inputs.dry_run || false }}
      # COS 凭据只注入独立同步 job，不进入桌面构建流程。
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_PUBLIC_DOMAIN: ${{ vars.S3_PUBLIC_DOMAIN }}
      S3_ENABLE_PATH_STYLE: '0'
      S3_SET_ACL: '0'
      PURECHAT_DESKTOP_UPDATE_URL: ${{ vars.PURECHAT_DESKTOP_UPDATE_URL }}
    steps:
      # 使用默认分支的发布脚本，不执行下载资产内或任意输入 ref 中的代码。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Check release and public update address
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid stable release tag'; exit 1; }
          test -n "$PURECHAT_DESKTOP_UPDATE_URL" || { echo 'Missing PURECHAT_DESKTOP_UPDATE_URL repository variable'; exit 1; }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease |
            jq -e '.isDraft == false and .isPrerelease == false'
      - name: Install script dependencies without lifecycle hooks
        # 发布只需运行校验与上传脚本，不执行仓库依赖的安装脚本。
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # 只下载所选平台及其更新清单需要的文件，避免执行 Release 中的代码。
          patterns=()
          if [[ "$TARGET_PLATFORM" == 'all' || "$TARGET_PLATFORM" == 'windows' ]]; then
            patterns+=(--pattern "PureChat-${version}-setup.exe" --pattern "PureChat-${version}-portable.exe" \
              --pattern "PureChat-${version}-setup.exe.blockmap" --pattern 'latest.yml')
          fi
          if [[ "$TARGET_PLATFORM" == 'all' || "$TARGET_PLATFORM" == 'mac' ]]; then
            patterns+=(--pattern "PureChat-${version}-arm64.dmg" --pattern "PureChat-${version}-arm64.zip" \
              --pattern "PureChat-${version}-arm64.dmg.blockmap" --pattern "PureChat-${version}-arm64.zip.blockmap" \
              --pattern 'latest-mac.yml')
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/desktop-release" \
            "${patterns[@]}"
      - name: Publish and prune the selected platforms
        shell: bash
        run: |
          set -euo pipefail
          publish_args=()
          if [[ "$DRY_RUN" == 'true' ]]; then publish_args+=(--dry-run); fi
          # 发布器会校验已有文件并支持同版本续传；失败后重新校验并重试，最多 3 次。
          attempt=1
          while true; do
            if pnpm desktop:upload --platform "$TARGET_PLATFORM" --dir "$RUNNER_TEMP/desktop-release" \
              --version "${RELEASE_TAG#v}" "${publish_args[@]}"; then
              break
            fi
            if (( attempt >= 3 )); then
              echo "Desktop sync failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Desktop sync failed; retrying in ${delay}s (attempt ${attempt}/3)" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
