# 推送 vX.Y.Z tag 时创建 GitHub Release；同 tag 已存在则跳过，不覆盖。
# tag 必须等于 package.json version，且 CHANGELOG.md 必须有对应「## X.Y.Z」章节。
#
# 触发方法：
#   git tag v0.2.8
#   git push origin v0.2.8
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, skip"
            exit 0
          fi
          node scripts/github-release-notes.mjs "$tag" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "${RUNNER_TEMP}/release-notes.md"
