name: purechat-deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

services:
  app:
    image: purechat-next:local
    pull_policy: missing
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    init: true
    user: '1001:1001'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3210}:3210'
    environment:
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET}
      CHANNEL_GATEWAY_ENABLED: ${CHANNEL_GATEWAY_ENABLED:-1}
      CHANNEL_GATEWAY_INTERNAL_SECRET: ${CHANNEL_GATEWAY_INTERNAL_SECRET:-}
      JWKS_KEY: ${JWKS_KEY}
      CRON_SECRET: ${CRON_SECRET}
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://${POSTGRES_USER:-purechat}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-purechat}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-purechat}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENABLE_PATH_STYLE: ${S3_ENABLE_PATH_STYLE:-0}
      S3_SET_ACL: ${S3_SET_ACL:-0}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-0}
      SEARCH_PROVIDERS: ${SEARCH_PROVIDERS:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      PURECHAT_API_KEY: ${PURECHAT_API_KEY:-}
      NODE_OPTIONS: >-
        --dns-result-order=ipv4first --use-openssl-ca
        --max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-320}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPUS:-1.0}
    pids_limit: ${APP_PIDS_LIMIT:-256}
    logging: *default-logging
    networks:
      app-network: {}

networks:
  app-network:
    driver: bridge
