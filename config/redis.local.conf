# 本地 Redis 安全与持久化策略。
# 运行时目录、PID、日志和端口由 scripts/shell/local-redis.sh 通过命令行覆盖。

bind 127.0.0.1 ::1
protected-mode yes
port 6379

daemonize yes
supervised no
loglevel notice

databases 16
timeout 0
tcp-keepalive 300

dbfilename dump.rdb
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

maxmemory 2gb
maxmemory-policy allkeys-lru

appendonly yes
appenddirname appendonlydir
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
