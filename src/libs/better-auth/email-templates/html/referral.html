<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>你已受邀使用 PureChat</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f4f5;
      color: #27272a;
      font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 600px; background: #fff; border-radius: 24px; overflow: hidden"
          >
            <tr>
              <td align="center" style="padding: 32px; font-size: 32px; font-weight: 700">PureChat</td>
            </tr>
            <tr>
              <td
                align="center"
                bgcolor="#5bb5ff"
                style="padding: 48px 24px; background: linear-gradient(135deg, #8c9dff, #48bbfa); color: #fff"
              >
                <h1 style="margin: 0 0 20px; font-size: 30px; line-height: 1.4">诚邀你使用 PureChat</h1>
                <p style="font-size: 17px; line-height: 1.8; margin: 0 0 28px">与好友一起体验 AI 对话、搜索和创作</p>
                <a
                  href="{{url}}"
                  style="
                    display: inline-block;
                    background: #fff;
                    color: #27272a;
                    border-radius: 32px;
                    padding: 14px 32px;
                    text-decoration: none;
                    font-weight: 700;
                  "
                  >接受邀请</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 24px; font-size: 14px; line-height: 1.8">
                <p><strong>{{userName}}</strong> 邀请你使用 PureChat。</p>
                <p>此邀请仅面向新用户，请使用收件邮箱注册并完成邮箱验证。邀请链接有效期为 7 天。</p>
                <p>按钮无法打开？请复制以下链接到浏览器：</p>
                <p style="word-break: break-all"><a href="{{url}}" style="color: #2563eb">{{url}}</a></p>
                <p style="color: #71717a">如果你不认识邀请人，可以忽略这封邮件。</p>
              </td>
            </tr>
          </table>
          <p style="color: #71717a; font-size: 12px">PureChat · AI 对话、搜索和创作</p>
        </td>
      </tr>
    </table>
  </body>
</html>
