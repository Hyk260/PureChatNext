name: purechat-deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

services:
  app:
    image: purechat-next:local
    build:
      context: ../..
      dockerfile: Dockerfile
    init: true
    user: '1001:1001'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    ports:
      - '127.0.0.1:${APP_PORT:-3210}:3210'
    environment:
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SECRET: ${AUTH_SECRET}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET}
      CHANNEL_GATEWAY_ENABLED: ${CHANNEL_GATEWAY_ENABLED:-1}
      CHANNEL_GATEWAY_INTERNAL_SECRET: ${CHANNEL_GATEWAY_INTERNAL_SECRET:-}
      JWKS_KEY: ${JWKS_KEY}
      CRON_SECRET: ${CRON_SECRET}
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PREFIX: purechat
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: ${RUSTFS_BUCKET}
      S3_ENDPOINT: http://rustfs:9000
      S3_ENABLE_PATH_STYLE: '1'
      S3_SET_ACL: '0'
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-1}
      SEARCH_PROVIDERS: searxng
      SEARXNG_URL: http://searxng:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      PURECHAT_API_KEY: ${PURECHAT_API_KEY:-}
      NODE_OPTIONS: >-
        --dns-result-order=ipv4first --use-openssl-ca
        --max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-768}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    cpus: ${APP_CPUS:-2.0}
    pids_limit: ${APP_PIDS_LIMIT:-512}
    logging: *default-logging
    networks: [app-network, data-network]

  postgresql:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    # The official entrypoint needs a transient root phase to initialize and
    # chown the volume, then drops the server to the image's postgres UID 70.
    user: '0:0'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=16m,uid=70,gid=70,mode=1770
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.5}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging: *default-logging
    networks: [data-network]

  redis:
    image: redis:8.8.1-alpine3.23@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    user: redis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server --requirepass "$${REDIS_PASSWORD}" --save 60 1000 \
          --appendonly yes --maxmemory "${REDIS_MAXMEMORY:-384mb}" --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${REDIS_MEMORY_LIMIT:-768m}
    cpus: ${REDIS_CPUS:-1.0}
    pids_limit: ${REDIS_PIDS_LIMIT:-256}
    logging: *default-logging
    networks: [data-network]

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    user: rustfs:rustfs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOG_DIRECTORY: /tmp
    command: ['/data']
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${RUSTFS_MEMORY_LIMIT:-768m}
    cpus: ${RUSTFS_CPUS:-1.0}
    pids_limit: ${RUSTFS_PIDS_LIMIT:-256}
    logging: *default-logging
    networks: [data-network]

  searxng:
    image: searxng/searxng:2026.8.3-aa059419f@sha256:77a4f1013b9e2ba857b360dcfea68bc10b3cc5f63572f3d7861cc323cba22c16
    user: searxng:searxng
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - ../dev/searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: '8080'
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET before deploying SearXNG}
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
      FORCE_OWNERSHIP: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || wget -qO- http://localhost:8080/ >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${SEARXNG_MEMORY_LIMIT:-768m}
    cpus: ${SEARXNG_CPUS:-1.5}
    pids_limit: ${SEARXNG_PIDS_LIMIT:-256}
    logging: *default-logging
    networks: [app-network]

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

  searxng_cache:

networks:
  app-network:
    driver: bridge
  data-network:
    driver: bridge
    internal: true
