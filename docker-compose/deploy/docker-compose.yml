name: purechat-deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

services:
  app:
    image: purechat-next:local
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: purechat-app
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-3210}:3210'
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SECRET: ${AUTH_SECRET}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET}
      WECHAT_GATEWAY_ENABLED: 'true'
      JWKS_KEY: ${JWKS_KEY}
      CRON_SECRET: ${CRON_SECRET}
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PREFIX: purechat
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: ${RUSTFS_BUCKET}
      S3_ENDPOINT: http://rustfs:9000
      S3_ENABLE_PATH_STYLE: '1'
      S3_SET_ACL: '0'
      SEARCH_PROVIDERS: searxng
      SEARXNG_URL: http://searxng:8080
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  wechat-gateway:
    image: purechat-next:local
    container_name: purechat-wechat-gateway
    init: true
    command: ['node', '/app/wechat-gateway.mjs']
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PREFIX: purechat
      WECHAT_GATEWAY_ENABLED: 'true'
    depends_on:
      app:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/wechat-gateway.mjs', '--healthcheck']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: purechat-deploy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [purechat-network]

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.1-alpine}
    container_name: purechat-deploy-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - '60'
      - '1000'
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [purechat-network]

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: purechat-deploy-rustfs
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    command: ['--access-key', '${RUSTFS_ACCESS_KEY}', '--secret-key', '${RUSTFS_SECRET_KEY}', '/data']
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging
    networks: [purechat-network]

  rustfs-init:
    image: ${MC_IMAGE:-minio/mc:latest}
    container_name: purechat-deploy-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb "rustfs/$${RUSTFS_BUCKET}" --ignore-existing
    restart: 'no'
    logging: *default-logging
    networks: [purechat-network]

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: purechat-deploy-searxng
    volumes:
      - ../dev/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: '8080'
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || wget -qO- http://localhost:8080/ >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [purechat-network]

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

networks:
  purechat-network:
    driver: bridge
