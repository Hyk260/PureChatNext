general:
  # 调试模式，仅用于开发。会被 ${SEARXNG_DEBUG} 覆盖
  debug: false
  # 显示名称
  instance_name: "searxng"
  # 例如：https://example.com/privacy
  privacypolicy_url: false
  # 设为 true 可使用 searx/info/en/donate.md 中的自定义捐赠页
  # 设为 false 可禁用捐赠链接
  donation_url: false
  # mailto:contact@example.com
  contact_url: false
  # 记录统计信息
  enable_metrics: true
  # 以 OpenMetrics 格式在 /metrics 暴露统计信息
  # 留空则禁用（未设置密码）
  # open_metrics: <password>
  open_metrics: ''

brand:
  new_issue_url: https://github.com/searxng/searxng/issues/new
  docs_url: https://docs.searxng.org/
  public_instances: https://searx.space
  wiki_url: https://github.com/searxng/searxng/wiki
  issue_url: https://github.com/searxng/searxng/issues
  # custom:
  #   maintainer: "Jon Doe"
  #   # 页脚自定义条目：[标题]: [链接]
  #   links:
  #     Uptime: https://uptime.searxng.org/history/darmarit-org
  #     About: "https://searxng.org"

search:
  # 过滤结果。0：无，1：中等，2：严格
  safe_search: 0
  # 可用的自动补全后端："baidu"、"brave"、"dbpedia"、"duckduckgo"、"google"、"yandex"、
  # "mwmbl"、"seznam"、"stract"、"swisscows"、"qwant"、"wikipedia" -
  # 留空则默认关闭。
  autocomplete: ""
  # 启动自动补全前需输入的最少字符数
  autocomplete_min: 4
  # 搜索结果 URL 旁 favicon 的解析后端。
  # 可用解析器："allesedv"、"duckduckgo"、"google"、"yandex" - 留空则默认关闭。
  favicon_resolver: ""
  # 默认搜索语言 - 留空则根据浏览器信息检测，或
  # 使用 'languages.py' 中的语言代码
  default_lang: "auto"
  # max_page: 0  # 若引擎支持分页，0 表示不限制页数
  # 可用语言
  # languages:
  #   - all
  #   - en
  #   - en-US
  #   - de
  #   - it-IT
  #   - fr
  #   - fr-BE
  # 引擎出错后的封禁时间（秒）
  ban_time_on_fail: 5
  # 引擎出错后的最长封禁时间（秒）
  max_ban_time_on_fail: 120
  suspended_times:
    # 引擎出错后的挂起时间（秒；设为 0 禁用）
    # 对应错误 “Access denied” 与 “HTTP error [402, 403]”
    SearxEngineAccessDenied: 86400
    # 对应错误 “CAPTCHA”
    SearxEngineCaptcha: 86400
    # 对应错误 “Too many request” 与 “HTTP error 429”
    SearxEngineTooManyRequests: 3600
    # Cloudflare CAPTCHA
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    # ReCAPTCHA
    recaptcha_SearxEngineCaptcha: 604800

  # 删除对应格式即可禁止访问，使用小写。
  # formats: [html, csv, json, rss]
  formats:
    - html
    - json
server:
  # 会被 ${SEARXNG_PORT} 与 ${SEARXNG_BIND_ADDRESS} 覆盖
  port: 8888
  bind_address: "127.0.0.1"
  # 实例的公开 URL，用于保证入站链接正确。会被 ${SEARXNG_URL} 覆盖。
  base_url: /  # "http://example.com/location"
  # 限制对本实例的请求速率，拦截部分机器人。
  # 会被 ${SEARXNG_LIMITER} 覆盖
  limiter: false
  # 启用仅面向公开实例的功能。
  # 会被 ${SEARXNG_PUBLIC_INSTANCE} 覆盖
  public_instance: false

  # 若实例使用 /etc/searxng/settings.yml，请在该文件中设置以下
  # 配置项。

  secret_key: "779c5b69fe650f147be9012abca6b44a8697acdb2817b46353f4779bb07d81d1"  # 会被 ${SEARXNG_SECRET} 覆盖
  # 通过 SearXNG 代理图片结果。会被 ${SEARXNG_IMAGE_PROXY} 覆盖
  image_proxy: false
  # 支持 1.0 与 1.1
  http_protocol_version: "1.0"
  # POST 查询更安全（不会出现在浏览历史中），但在使用 Firefox 容器时可能出问题
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

redis:
  # 连接 Redis 数据库的 URL。会被 ${SEARXNG_REDIS_URL} 覆盖。
  # https://docs.searxng.org/admin/settings/settings_redis.html#settings-redis
  url: false

ui:
  # 自定义静态资源路径 - 未改动则留空
  static_path: ""
  # 会被 ${SEARXNG_STATIC_USE_HASH} 覆盖。
  static_use_hash: false
  # 自定义模板路径 - 未改动则留空
  templates_path: ""
  # query_in_title：为 true 时，结果页标题会包含查询词
  # 会降低隐私性，因为浏览器可能记录页面标题。
  query_in_title: false
  # infinite_scroll：为 true 时，滚动到当前页底部会自动加载下一页。
  infinite_scroll: false
  # UI 主题
  default_theme: simple
  # 结果是否居中？
  center_alignment: false
  # 互联网档案馆 URL 前缀，需要时别忘了末尾斜杠。
  # cache_url: "https://webcache.googleusercontent.com/search?q=cache:"
  # 默认界面语言 - 留空则根据浏览器信息检测，或
  # 使用 'locales' 配置段中的代码
  default_locale: ""
  # 默认在新标签页打开结果链接
  # results_on_new_tab: false
  theme_args:
    # simple 主题样式：auto、light、dark
    simple_style: auto
  # 选中分类后立即执行搜索。
  # 禁用以同时选择多个分类并手动开始搜索。
  search_on_category_select: true
  # 快捷键：default 或 vim
  hotkeys: default
  # URL 显示格式：pretty、full 或 host
  url_formatting: pretty

# 在偏好设置页锁定任意配置项。
#
# preferences:
#   lock:
#     - categories
#     - language
#     - autocomplete
#     - favicon
#     - safesearch
#     - method
#     - doi_resolver
#     - locale
#     - theme
#     - results_on_new_tab
#     - infinite_scroll
#     - search_on_category_select
#     - method
#     - image_proxy
#     - query_in_title

# searx 支持通过外部服务代理搜索结果：
# https://github.com/asciimoo/morty 若已运行 morty，取消下方注释
# morty 代理密钥为 base64 编码（保留 !!binary 写法）
# 注意：自 commit af77ec3 起，morty 接受 base64 编码密钥。
#
# result_proxy:
#   url: http://127.0.0.1:3000/
#   # 密钥为 base64 字符串，YAML 的 !!binary 前缀可选
#   key: !!binary "your_morty_proxy_key"
#   # [true|false] 是否在每条结果旁显示 “proxy” 按钮
#   proxify_results: true

# 与搜索引擎的通信
#
outgoing:
  # 默认超时（秒），可被单个引擎覆盖
  request_timeout: 6.0
  # 最大超时（秒）
  # max_request_timeout: 10.0
  # searx_useragent 后缀，可包含管理员邮箱等信息
  useragent_suffix: ""
  # 可建立的最大并发连接数。
  pool_connections: 100
  # 允许连接池在此数量以下保持 keep-alive 连接。
  pool_maxsize: 20
  # 参见 https://www.python-httpx.org/http2/
  enable_http2: true
  # 若要使用自定义服务器证书，取消下方注释
  # 参见 https://www.python-httpx.org/advanced/#changing-the-verification-defaults
  # 以及 https://www.python-httpx.org/compatibility/#ssl-configuration
  #  verify: ~/.mitmproxy/mitmproxy-ca-cert.cer
  #
  # 若要使用代理，取消下方注释；SOCKS 代理参见：
  #   https://2.python-requests.org/en/latest/user/advanced/#proxies
  # 也支持，参见
  #   https://2.python-requests.org/en/latest/user/advanced/#socks
  #
  #  proxies:
  #    all://:
  #      - http://proxy1:8080
  #      - http://proxy2:8080
  #
  #  using_tor_proxy: true
  #
  # 为代理耗时额外增加的秒数
  #
  #  extra_proxy_timeout: 10
  #
  # 仅当有多个网卡可作为出站搜索请求源时，才取消下方注释
  #
  #  source_ips:
  #    - 1.1.1.1
  #    - 1.1.1.2
  #    - fe80::/126

# 外部插件配置，详情见
#   https://docs.searxng.org/admin/settings/settings_plugins.html
#
# plugins:
#   - mypackage.mymodule.MyPlugin
#   - mypackage.mymodule.MyOtherPlugin
#   - ...

# 注释或取消注释插件，以默认启用 / 禁用。
#   https://docs.searxng.org/admin/settings/settings_plugins.html
#
# enabled_plugins:
#   # 未做配置时默认启用的插件 ..
#   - 'Basic Calculator'
#   - 'Hash plugin'
#   - 'Self Information'
#   - 'Tracker URL remover'
#   - 'Unit converter plugin'
#   - 'Ahmia blacklist'  # 是否启用取决于 outgoing.using_tor_proxy
#   # 未做配置时默认禁用的插件 ..
#   - 'Hostnames plugin'  # 见下方 'hostnames' 配置
#   - 'Open Access DOI rewrite'
#   - 'Tor check plugin'

# “Hostnames” 插件配置：
#
# hostnames:
#   replace:
#     '(.*\.)?youtube\.com$': 'invidious.example.com'
#     '(.*\.)?youtu\.be$': 'invidious.example.com'
#     '(.*\.)?reddit\.com$': 'teddit.example.com'
#     '(.*\.)?redd\.it$': 'teddit.example.com'
#     '(www\.)?twitter\.com$': 'nitter.example.com'
#   remove:
#     - '(.*\.)?facebook.com$'
#   low_priority:
#     - '(.*\.)?google(\..*)?$'
#   high_priority:
#     - '(.*\.)?wikipedia.org$'
#
# 也可使用外部文件配置 “Hostnames” 插件：
#
# hostnames:
#  replace: 'rewrite-hosts.yml'
#
# 'rewrite-hosts.yml' 内容（与 'settings.yml' 放在同一目录）：
# '(.*\.)?youtube\.com$': 'invidious.example.com'
# '(.*\.)?youtu\.be$': 'invidious.example.com'
#

checker:
  # 调试模式下禁用 checker
  off_when_debug: true

  # 使用 "scheduling: false" 禁用调度
  # scheduling：interval 或 int

  # 启用调度器：
  # * 取消 “scheduling” 段注释
  # * 在 uwsgi.ini 中添加 "cache2 = name=searxngcache,items=2000,blocks=2000,blocksize=4096,bitmap=1"

  # scheduling:
  #   start_after: [300, 1800]  # 首次运行 checker 前的延迟
  #   every: [86400, 90000]     # checker 运行频率

  # 额外测试：仅用于 YAML 锚点（见 engines 段）
  #
  additional_tests:
    rosebud: &test_rosebud
      matrix:
        query: rosebud
        lang: en
      result_container:
        - not_empty
        - ['one_title_contains', 'citizen kane']
      test:
        - unique_results

    android: &test_android
      matrix:
        query: ['android']
        lang: ['en', 'de', 'fr', 'zh-CN']
      result_container:
        - not_empty
        - ['one_title_contains', 'google']
      test:
        - unique_results

  # 测试：仅用于 YAML 锚点（见 engines 段）
  tests:
    infobox: &tests_infobox
      infobox:
        matrix:
          query: ["linux", "new york", "bbc"]
        result_container:
          - has_infobox

categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:

engines:
