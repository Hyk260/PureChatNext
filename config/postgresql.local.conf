# 本地 PostgreSQL 基础配置。
# 数据目录、pg_hba.conf、PID 和日志路径由 scripts/shell/local-postgres.sh 管理。

# 仅允许本机连接，不暴露到局域网或公网。
listen_addresses = 'localhost'
port = 5432
max_connections = 100

# Apple M4 / 16GB 内存的保守本地开发配置。
shared_buffers = '512MB'
effective_cache_size = '4GB'
work_mem = '8MB'
maintenance_work_mem = '256MB'

# 保持完整持久化与故障恢复能力。
fsync = on
full_page_writes = on
wal_compression = on
checkpoint_timeout = '15min'
max_wal_size = '2GB'
min_wal_size = '256MB'

password_encryption = 'scram-sha-256'
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
log_min_messages = 'warning'
log_line_prefix = '%m [%p] %q%u@%d '
