# Docker 工作流：校验 Compose 配置、运行健康检查，并构建 amd64/arm64 镜像进行安全验证。
name: Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-and-unit:
    name: Compose config and health route tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate Compose
        env:
          SEARXNG_SECRET: ci-compose-validation-secret
        run: pnpm docker:validate
      - name: Test health helpers and route
        run: pnpm exec vitest run src/app/api/health/route.test.ts src/server/health/dependencies.test.ts

  amd64-smoke:
    name: amd64 image and stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Install Docker Scout CLI
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/docker/scout-cli/v1.24.0/install.sh \
            --output "${RUNNER_TEMP}/install-docker-scout.sh"
          sh "${RUNNER_TEMP}/install-docker-scout.sh" v1.24.0
          docker scout version
      - name: Build amd64 application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: purechat-next:local
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start and verify production stack
        run: pnpm docker:verify:local -- --skip-build --platform linux/amd64

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install production dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for High/Critical vulnerabilities
        run: pnpm audit --prod --audit-level high

  multi-platform-build:
    name: Build ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
