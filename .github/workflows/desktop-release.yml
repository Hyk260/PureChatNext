# 桌面发行：手动构建 Windows x64（Installer/Portable）与 macOS arm64（DMG/ZIP），汇总为 Release 草稿。
#
# 使用方法：
#   1. 将工作流合入 main；更新根 package.json 的 X.Y.Z 稳定版本和 apps/desktop/build/release-notes.md。
#   2. Actions → Desktop release → Run workflow，选择源码分支；所有 job 固定使用触发时的 commit。
#   3. 从运行页下载两个 Artifact（保留 30 天），或检查 vX.Y.Z 草稿的四个文件后手动发布。
#   4. 不要提前推送同版本 tag 让 release.yml 公开发布；已公开版本不会被本工作流覆盖。
#
# 配置与权限：
#   - 可选仓库 Variable：PURECHAT_DESKTOP_CLOUD_URL，默认 https://next.purechat.cn；只允许无凭据的 HTTP(S) URL。
#   - 无需数据库、AI Key、Apple 证书或 PAT；GH_TOKEN 使用 GitHub 自动提供的 GITHUB_TOKEN。
#   - 默认 contents: read；只有草稿 job 申请 contents: write，无需全局开启写权限。
#   - GITHUB_TOKEN 不能获得 workflow 写权限；所选分支的工作流必须与默认分支一致，预检会提前检查。
#   - macOS 仅 ad-hoc 签名，不公证；不配置自动更新源，公开下载链接需发布草稿后才能使用。
# 详细说明与失败排查见 apps/desktop/README.md 的“GitHub Actions 手动打包”。
name: Desktop release
run-name: Desktop release from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 无需安装 workspace 依赖，先排除版本、说明、服务地址与 workflow 写权限方面的配置错误。
  prepare:
    name: Resolve desktop version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PURECHAT_DESKTOP_CLOUD_URL: ${{ vars.PURECHAT_DESKTOP_CLOUD_URL || 'https://next.purechat.cn' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # 保留只读凭据供下一步 fetch 默认分支，兼容私有仓库；checkout 的 post 阶段会清理凭据。
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          # 与 Docker 工作流保持一致，满足依赖要求的 Node >=22.22.0。
          node-version: 22.23.2
      - name: Check selected workflow matches default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          if ! git diff --quiet FETCH_HEAD "$GITHUB_SHA" -- .github/workflows; then
            echo '::error::所选 commit 的工作流与默认分支不同，请先合入默认分支，避免 Release API 的 workflow 写权限错误。'
            exit 1
          fi
      - name: Validate version, release notes and cloud URL
        id: version
        shell: bash
        run: |
          version="$(node scripts/github-desktop-release.mjs preflight)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 一端失败不取消另一端，成功端的 Artifact 仍可下载；草稿 job 必须等待两端成功。
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            os: windows-2022
            first-artifact: setup.exe
            second-artifact: portable.exe
          - platform: mac
            arch: arm64
            os: macos-15
            first-artifact: arm64.dmg
            second-artifact: arm64.zip
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # 构建时固化的公开服务地址；不需要 APP_URL、DATABASE_URL 或任何服务端密钥。
      PURECHAT_DESKTOP_CLOUD_URL: ${{ vars.PURECHAT_DESKTOP_CLOUD_URL || 'https://next.purechat.cn' }}
      # 显式关闭更新源；--publish never 只禁止 electron-builder 上传，并不会关闭更新配置。
      PURECHAT_DESKTOP_UPDATE_URL: ''
      # 禁用正式证书自动发现；macOS 命令仍显式使用 identity=- 生成 arm64 所需的 ad-hoc 签名。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      # 必须先安装 pnpm，再启用 setup-node 的 pnpm 缓存，否则查找 store 时会找不到命令。
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package Windows Installer and Portable
        if: matrix.platform == 'windows'
        # 一次生成两个 EXE；分开执行 package 命令会清空 release/，删掉前一份产物。
        run: pnpm package:desktop:win --x64
      - name: Package macOS DMG and ZIP with ad-hoc signing
        if: matrix.platform == 'mac'
        run: pnpm package:desktop:mac --arm64 -c.mac.identity=- -c.mac.notarize=false
      - name: Verify expected distribution files
        run: node scripts/github-desktop-release.mjs verify apps/desktop/release "${{ matrix.platform }}"
      - name: Upload desktop distribution files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          # 精确文件名避免上传解包目录、旧版本、blockmap 和 builder-debug.yml。
          path: |
            apps/desktop/release/PureChat-${{ needs.prepare.outputs.version }}-${{ matrix.first-artifact }}
            apps/desktop/release/PureChat-${{ needs.prepare.outputs.version }}-${{ matrix.second-artifact }}
          if-no-files-found: error
          # 兼容同一次运行的 Re-run all jobs，替换此前同名 Artifact。
          overwrite: true
          retention-days: 30
          compression-level: 0 # 安装包已压缩，不再重复压缩，缩短上传时间。

  draft:
    name: Assemble desktop Release draft
    needs: [prepare, build] # 默认 success()：两端任一失败/取消，均不修改 Release。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # 与现有 tag 发布工作流使用同一 concurrency group，串行处理同版本。
    concurrency:
      group: release-refs/tags/${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # 发行脚本用 git ls-remote 校验 tag，需要保留凭据访问私有仓库。
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          # 不提供 run-id/token，仅读取本次运行的 Artifact，避免混入其他 commit 的安装包。
          pattern: desktop-${{ needs.prepare.outputs.version }}-*
          path: desktop-release-artifacts
          merge-multiple: true
      - name: Validate and upload all four files to a draft
        env:
          # gh CLI 读取 GH_TOKEN；只在需要写 Release 的步骤注入，不传入打包 job。
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-desktop-release.mjs draft desktop-release-artifacts
