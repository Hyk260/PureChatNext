name: purechat

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

services:
  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: purechat-postgres
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.1-alpine}
    container_name: purechat-redis
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server --save 60 1000 --appendonly yes \
          --maxmemory "${REDIS_MAXMEMORY:-512mb}" --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-beta.12}
    container_name: purechat-rustfs
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_PORT:-9000}:9000'
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_ADMIN_PORT:-9001}:9001'
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    command: ['/data']
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  rustfs-init:
    image: ${MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    container_name: purechat-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb "rustfs/$${RUSTFS_BUCKET}" --ignore-existing
    restart: 'no'
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.8.3-aa059419f}
    container_name: purechat-searxng
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_PORT:-8180}:8080'
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: '8080'
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET before starting SearXNG}
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || wget -qO- http://localhost:8080/ >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

networks:
  purechat-network:
    driver: bridge
