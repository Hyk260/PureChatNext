# PureChat development SearXNG profile.
# Keep this file as a small override of the pinned/default SearXNG settings.
use_default_settings:
  engines:
    keep_only:
      - bing
      - bing images
      - bing news
      - bing videos
      - arxiv
      - github
      - google
      - google news
      - bilibili
      - sogou wechat

general:
  debug: false
  instance_name: purechat-searxng
  enable_metrics: false

search:
  safe_search: 0
  default_lang: auto
  ban_time_on_fail: 15
  max_ban_time_on_fail: 300
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: 0.0.0.0
  base_url: /
  limiter: false
  public_instance: false
  # Injected by docker-compose; do not commit a shared production secret.
  secret_key: "change-me-through-SEARXNG_SECRET"
  image_proxy: false
  method: POST
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

redis:
  url: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

categories_as_tabs:
  general:
  images:
  videos:
  news:
  music:
  it:
  science:
  files:
  social media:

engines:
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
    timeout: 6.0

  - name: bing images
    disabled: false
    timeout: 6.0

  - name: bing news
    disabled: false
    timeout: 6.0

  - name: bing videos
    disabled: false
    timeout: 6.0

  - name: arxiv
    disabled: false
    timeout: 6.0

  - name: github
    disabled: false
    categories: [it, repos]
    timeout: 8.0

  - name: google
    disabled: false
    inactive: false
    categories: [general]
    timeout: 8.0

  - name: google news
    disabled: false
    categories: [news]
    timeout: 8.0

  - name: bilibili
    disabled: false
    categories: [videos]
    timeout: 8.0

  - name: sogou wechat
    disabled: false
    categories: [general, news]
    timeout: 8.0
