<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureChat</title>
    <meta
      name="description"
      content="PureChat is a chat application that allows you to chat with your friends and family."
    />
    <!--SPA_SERVER_CONFIG-->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      html body {
        background: #f8f8f8;
      }
      html[data-theme='dark'] body {
        background-color: #000;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }
      #loading-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 0.6;
        color: #1f1f1f;
      }
      html[data-theme='dark'] #loading-brand {
        color: #f0f0f0;
      }
      #loading-brand .spinner {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      #loading-brand .text {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('theme') || 'system'
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var resolvedTheme = theme === 'system' ? systemTheme : theme
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme)
        }
      })()
    </script>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-brand" aria-label="Loading" role="status">
        <span aria-hidden="true" class="spinner"></span>
      </div>
    </div>
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/spa/entry.web.tsx"></script>
  </body>
</html>
