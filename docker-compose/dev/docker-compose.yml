name: purechat

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

services:
  postgresql:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  redis:
    image: redis:8.8.1-alpine3.23@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server --save 60 1000 --appendonly yes \
          --maxmemory "${REDIS_MAXMEMORY:-384mb}" --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_PORT:-9000}:9000'
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_ADMIN_PORT:-9001}:9001'
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    command: ['/data']
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

  searxng:
    image: searxng/searxng:2026.8.3-aa059419f@sha256:77a4f1013b9e2ba857b360dcfea68bc10b3cc5f63572f3d7861cc323cba22c16
    ports:
      - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_PORT:-8180}:8080'
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: '8080'
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET before starting SearXNG}
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
      FORCE_OWNERSHIP: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || wget -qO- http://localhost:8080/ >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [purechat-network]

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

  searxng_cache:

networks:
  purechat-network:
    driver: bridge
